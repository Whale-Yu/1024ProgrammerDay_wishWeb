<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>节日专属祝福</title>
    <style>
        :root {
            /* 在这里替换为你的背景图 URL（或留空使用渐变色作为备用） */
            --bg1-url: url('bg.png');
            --bg2-url: url('bg.png');

            --bg1-fallback: linear-gradient(135deg, #1a2a4f 0%, #0f1e3d 50%, #081426 100%);
            --bg2-fallback: linear-gradient(135deg, #1a2a4f 0%, #0f1e3d 50%, #081426 100%);

            --accent: #00d1b2;
            --glass: rgba(255, 255, 255, 0.06);
            --text-main: #e6f0ff;
            --muted: rgba(230, 240, 255, 0.85);
            font-family: system-ui, -apple-system, "Helvetica Neue", "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", "Microsoft Yahei", sans-serif;
        }

        * {
            box-sizing: border-box
        }

        html, body {
            height: 100%;
            margin: 0
        }

        body {
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            background: #071025;
        }

        /* 居中容器 */
        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        /* 通用屏幕样式 */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            gap: 18px;
            transition: opacity 480ms ease, transform 480ms ease;
            will-change: opacity, transform;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        /* Intro 页面 -- 使用背景图或者渐变作为后备 */
        .intro {
            z-index: 2;
            background-image: var(--bg1-url), linear-gradient(rgba(12, 20, 40, 0.6), rgba(8, 15, 30, 0.6)), var(--bg1-fallback);
            background-blend-mode: normal, overlay, normal;
        }

        .intro .overlay-card {
            width: min(1200px, 96%);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            border-radius: 18px;
            padding: 40px 36px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
        }

        .title {
            font-size: clamp(36px, 8vw, 64px);
            font-weight: 700;
            margin: 0 0 16px 0;
            letter-spacing: 0.8px;
            text-shadow: 0 6px 22px rgba(2, 6, 23, 0.6);
        }

        .subtitle {
            color: var(--muted);
            font-size: clamp(22px, 4.5vw, 32px);
            margin-bottom: 28px
        }

        /* 设计感按钮 */
        .btn {
            display: inline-grid;
            place-items: center;
            gap: 16px;
            padding: 20px 32px;
            border-radius: 18px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
            border: none;
            cursor: pointer;
            user-select: none;
            transition: transform 160ms ease, box-shadow 160ms ease;
            font-weight: 700;
            color: var(--text-main);
            font-size: clamp(22px, 4vw, 32px);
            box-shadow: 0 6px 18px rgba(3, 10, 30, 0.45);

            isolation: isolate;
            transform: translateZ(0);
            backface-visibility: hidden;
            overflow: hidden;
            outline: 1px solid transparent;

        }

        .btn:active {
            transform: translateY(2px) scale(0.997)
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45)
        }

        .btn .icon {
            width: 60px; /* 稍大一点，更突出 */
            height: 60px;
            display: inline-grid;
            place-items: center;
            border-radius: 16px; /* 更圆润 */
            background: linear-gradient(180deg, #FFD166, #EF476F); /* 彩色渐变，更喜庆 */
            color: #fff; /* 白色文字/emoji 更醒目 */
            font-weight: 700;
            font-size: 28px; /* 略大，视觉更好 */
            margin-right: 16px;
            text-shadow: 0 2px 6px rgba(255, 255, 255, 0.6); /* 光晕效果 */
            box-shadow: 0 0 12px rgba(255, 209, 178, 0.6),
            0 4px 14px rgba(0, 0, 0, 0.3); /* 阴影增加立体感 */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Hover / 鼠标悬停微动效 */
        .btn:hover .icon {
            transform: translateY(-4px) rotate(-10deg) scale(1.05);
            box-shadow: 0 0 18px rgba(255, 209, 178, 0.8),
            0 6px 18px rgba(0, 0, 0, 0.35);
        }

        /* 点击按下的效果 */
        .btn:active .icon {
            transform: translateY(2px) rotate(0deg) scale(0.98);
        }


        .hint {
            font-size: 13px;
            color: var(--muted);
            margin-top: 10px
        }

        /* Blessing 页面 */
        .blessing {
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            background-image: var(--bg1-url), linear-gradient(rgba(12, 20, 40, 0.6), rgba(8, 15, 30, 0.6)), var(--bg1-fallback);
            background-blend-mode: normal, overlay, normal;
        }

        .blessing.visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1)
        }

        .message-box {
            width: min(980px, 94%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 12px 48px rgba(2, 8, 30, 0.6);
            backdrop-filter: blur(6px);
        }

        .message {
            font-size: clamp(22px, 5vw, 42px);
            line-height: 1.4;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 18px 0;
            padding: 0 6px;
            min-height: 3.6em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 300ms ease, opacity 300ms ease;
        }

        .sub {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 18px
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center
        }

        .ghost-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--muted)
        }

        /* 小加载指示（用于“再来一条”按钮） */
        .ghost-btn .spinner {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-top-color: var(--accent);
            box-sizing: border-box;
            margin-right: 8px;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 180ms ease, transform 180ms ease
        }

        .ghost-btn.loading .spinner {
            opacity: 1;
            transform: scale(1);
            animation: spin 900ms linear infinite
        }

        @keyframes spin {
            from {
                transform: rotate(0deg)
            }
            to {
                transform: rotate(360deg)
            }
        }

        .ghost-btn .btn-text {
            display: inline-block;
            vertical-align: middle
        }

        /* 动画（淡入放大） */
        .anim-in {
            animation: fadeScaleIn 540ms cubic-bezier(.2, .9, .3, 1) both;
        }

        @keyframes fadeScaleIn {
            from {
                opacity: 0;
                transform: scale(0.88)
            }
            to {
                opacity: 1;
                transform: scale(1)
            }
        }

        /* 小屏适配 */
        @media (max-width: 520px) {
            .overlay-card {
                padding: 22px
            }

            .message {
                font-size: 20px
            }
        }

    </style>
</head>
<body>
<div class="stage">
    <!-- 引导页（任意位置点击或按钮点击触发） -->
    <section class="screen intro" id="intro" aria-label="引导页面">
        <div class="overlay-card" id="introCard">
            <h1 class="title">点击即可领取你的专属节日祝福</h1>
            <p class="subtitle">今天是程序员节 — 感谢你把世界变得更可靠、更聪明。</p>
            <div style="display:flex;align-items:center;justify-content:center;gap:10px;">
                <div class="btn" id="openBtn" role="button" aria-label="点击开启祝福">
                    <span class="icon">🎁</span>
                    <span>点击收取你的专属祝福</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 祝福页 -->
    <section class="screen blessing" id="blessing" aria-label="祝福页面">
        <div class="message-box anim-in" id="messageBox">
            <div class="message" id="message">祝你代码运行一次通过，Bug 永远被测试发现而不是上线发现！</div>
            <div class="actions">
            </div>
        </div>
    </section>
</div>

<script>
    // 预设祝福语库（可按需替换或扩展）
    const messages = [
        '愿你的代码永无bug，你的头发浓密如初！',
        '祝：编译一次过，需求永不改！',
        '愿你的逻辑像算法一样清晰，你的生活像服务器一样稳定！',
        '少掉一根头发，多完成一个需求！节日快乐！',
        '祝你：技术栈越堆越高，发际线绝不后退！',
        '今天不敲代码，只收祝福！辛苦了，了不起的程序员！',
        '愿产品经理的想法和你的代码一样，永远靠谱！',
        '感谢你用代码构建世界，辛苦了，记得抬头看看窗外的风景。',
        '你敲出的每一行代码，都是改变世界的力量。为你骄傲！',
        '愿你的努力都被看见，你的付出都有回报。节日快乐！',
        '除了代码，也别忘了生活的美好。今天，请好好休息！',
        '你的冷静和逻辑，是解决难题的关键。照顾好自己，你最棒！',
        '深夜的灯见证你的奋斗，愿你的未来一片光明！',
        '你是数字世界的建筑师，也是我们心中最可爱的人！',
        '键盘敲响未来，代码改变世界！继续闪耀吧，程序员！',
        '祝你：bug秒解，技术封神，升职加薪！',
        '每一次调试都是修炼，愿你早日成为自己心中的“大神”！',
        '前方无限可能，愿你的程序人生一路开挂！',
        '梦想有多大，你的代码舞台就有多大！加油！',

    ];

    const intro = document.getElementById('intro');
    const openBtn = document.getElementById('openBtn');
    const blessing = document.getElementById('blessing');
    const messageEl = document.getElementById('message');
    const messageBox = document.getElementById('messageBox');

    // 状态：防抖锁、当前索引、是否已展示祝福（用于 confetti）
    let clickLocked = false;
    let currentIdx = -1;
    let hasShown = false;
    let autoReturnTimer = null; // 自动返回定时器

    // 不重复的随机挑选
    function pickRandomNoRepeat() {
        if (messages.length === 0) return '';
        if (messages.length === 1) {
            currentIdx = 0;
            return messages[0];
        }
        let idx;
        let tries = 0;
        do {
            idx = Math.floor(Math.random() * messages.length);
            tries++;
            // 如果极端情况下多次尝试也没选到（非常罕见），就跳出
            if (tries > 8) break;
        } while (idx === currentIdx);
        currentIdx = idx;
        return messages[idx];
    }

    // 简单防抖包装器（返回带锁的函数）
    function withLock(fn, delay = 420) {
        return function (...args) {
            if (clickLocked) return;
            clickLocked = true;
            try {
                fn(...args);
            } catch (e) {
                console.error(e);
            }
            setTimeout(() => clickLocked = false, delay);
        };
    }

    // 轻量 confetti（只触发一次）
    function simpleConfettiOnce() {
        if (hasShown) return;
        hasShown = true;

        const c = document.createElement('canvas');
        c.style.position = 'fixed';
        c.style.left = 0;
        c.style.top = 0;
        c.style.width = '100%';
        c.style.height = '100%';
        c.style.pointerEvents = 'none';
        c.style.zIndex = 9999;
        c.width = innerWidth;
        c.height = innerHeight;
        document.body.appendChild(c);
        const ctx = c.getContext('2d');

        const pieces = [];
        const colors = ['#FFD166', '#06D6A0', '#118AB2', '#EF476F', '#A8DADC'];
        for (let i = 0; i < 80; i++) {
            pieces.push({
                x: Math.random() * c.width,
                y: Math.random() * c.height / 2 - 50,
                vx: (Math.random() - 0.5) * 6,
                vy: 2 + Math.random() * 5,
                w: 6 + Math.random() * 10,
                h: 6 + Math.random() * 6,
                color: colors[Math.floor(Math.random() * colors.length)],
                rot: Math.random() * Math.PI * 2,
                vr: (Math.random() - 0.5) * 0.25
            });
        }

        let start = null;

        function frame(ts) {
            if (!start) start = ts;
            const elapsed = ts - start;
            ctx.clearRect(0, 0, c.width, c.height);
            for (let p of pieces) {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.06; // gravity
                p.rot += p.vr;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            }
            if (elapsed < 2000) {
                requestAnimationFrame(frame);
            } else {
                // 继续保留一会儿然后移除
                setTimeout(() => {
                    try {
                        document.body.removeChild(c);
                    } catch (e) {
                    }
                }, 400);
            }
        }

        requestAnimationFrame(frame);
    }

    // 返回起始页
    function backToIntro() {
        // 清除可能存在的自动返回定时器
        if (autoReturnTimer) {
            clearTimeout(autoReturnTimer);
            autoReturnTimer = null;
        }

        // 让 intro 恢复可见并可交互
        intro.style.visibility = 'visible';
        intro.style.opacity = '1';
        intro.style.transform = 'scale(1)';
        intro.style.pointerEvents = 'auto';

        // 隐藏祝福页
        blessing.classList.remove('visible');

        // 将焦点回到按钮
        setTimeout(() => openBtn.focus(), 300);

        // 允许下一次重新触发 confetti（用户返回起始页后再次进入祝福页时会看到彩带）
        hasShown = false;
    }

    // 执行从 intro -> blessing 的过渡
    function showBlessing() {
        // 设置随机祝福（首次使用 non-repeat）
        messageEl.textContent = pickRandomNoRepeat();

        // 给祝福页加动画类并显示
        blessing.classList.add('visible');

        // 隐藏并禁用 intro 的交互（原因：intro 在 DOM 中 z-index 更高，虽然透明但会拦截点击）
        intro.style.transition = 'opacity 480ms ease, transform 480ms ease';
        intro.style.opacity = '0';
        intro.style.transform = 'scale(0.98)';
        intro.style.pointerEvents = 'none';

        // 为了彻底从交互中移除 intro，我们在过渡结束后把 visibility 设为 hidden（可选）
        const onEnd = (e) => {
            if (e.propertyName === 'opacity') {
                intro.style.visibility = 'hidden';
                intro.removeEventListener('transitionend', onEnd);
            }
        };
        intro.addEventListener('transitionend', onEnd);

        // 延迟0.5秒触发 confetti（仅首次）
        setTimeout(() => {
            simpleConfettiOnce();
        }, 200);

        // 小焦点效果
        messageBox.classList.remove('anim-in');
        // 重新触发入场动画
        void messageBox.offsetWidth;
        messageBox.classList.add('anim-in');

        // 设置15秒后自动返回首页
        if (autoReturnTimer) {
            clearTimeout(autoReturnTimer);
        }
        autoReturnTimer = setTimeout(() => {
            backToIntro();
        }, 15000);
    }

    // 包装好的锁版本函数，避免短时间重复触发
    const showBlessingLocked = withLock(showBlessing, 700);

    // 页面任意处点击（起始页）
    intro.addEventListener('click', function (evt) {
        showBlessingLocked();
    });

    // 按钮也做同样的事（阻止双触发）
    openBtn.addEventListener('click', function (evt) {
        evt.stopPropagation(); // 防止触发两次
        showBlessingLocked();
    });

    // 初始聚焦
    openBtn.setAttribute('tabindex', '0');
    openBtn.focus();

    /* 可选：如果你想在页面运行时动态替换背景图（例如通过 query string），
       下面是一个小示例：
       访问时可以使用 ?bg1=<image-url>&bg2=<image-url> 来覆盖 CSS 变量。
    */
    (function () {
        try {
            const params = new URLSearchParams(location.search);
            const bg1 = params.get('bg1');
            const bg2 = params.get('bg2');
            if (bg1) document.documentElement.style.setProperty('--bg1-url', `url('${bg1}')`);
            if (bg2) document.documentElement.style.setProperty('--bg2-url', `url('${bg2}')`);
        } catch (e) {/* ignore */
        }
    })();

</script>
</body>
</html>
